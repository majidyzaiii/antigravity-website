<!DOCTYPE html>
<html>
<body>
    <div id="test">TEST</div>
    <script>
        const el = document.getElementById('test');
        try {
            el.style.setProperty('animation', 'none', 'important');
            el.innerHTML = "WORKED";
        } catch(e) {
            el.innerHTML = "ERROR: " + e.message;
        }
    </script>









<!-- STRICT GLOBAL HEADER SIZE FIX V5 -->
<style id="global-header-size-fix-v5">
@media (min-width: 769px) {
    /* 1. Force strict 100px header container */
    html:root body header, 
    html:root body #ultimateScrollHeader header {
        height: 100px !important;
        max-height: 100px !important;
        min-height: 100px !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        display: flex !important;
        align-items: center !important;
    }
    
    /* 2. English Text Logo */
    html:root body header .brand-title-img-en, 
    html:root body #ultimateScrollHeader header .brand-title-img-en {
        height: 65px !important;
        max-height: 65px !important;
        min-height: 65px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
    }
    
    /* 3. Urdu Text Logo - Make it significantly larger to overcome transparent padding */
    html:root body header .urdu-title-png, 
    html:root body #ultimateScrollHeader header .urdu-title-png,
    html:root body.ur header .urdu-title-png,
    html:root body[dir="rtl"] header .urdu-title-png {
        height: 95px !important;
        max-height: 95px !important;
        min-height: 95px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
    }
    
    /* 4. Crest Logo in English (Default) */
    html:root body header .header-logo img,
    html:root body #ultimateScrollHeader header .header-logo img {
        height: 80px !important;
        max-height: 80px !important; 
        min-height: 80px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
    }
    
    /* 5. Crest Logo specifically in Urdu Mode - slightly larger if requested */
    html:root body.rtl header .header-logo img,
    html:root body[dir="rtl"] header .header-logo img,
    html:root body.ur header .header-logo img,
    html:root html[lang="ur"] body header .header-logo img {
        height: 95px !important;
        max-height: 95px !important; 
        min-height: 95px !important;
    }
}
</style>

</body>
</html>
