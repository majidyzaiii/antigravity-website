<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 400px;
  height: 400px;
  border: 2px solid green;
  position: relative;
  overflow: hidden;
  margin: 50px;
}
.ribbon {
  position: absolute;
  background: red;
  color: white;
  text-align: center;
  font-family: Arial;
  font-size: 20px;
  font-weight: bold;
  
  /* The tricky part */
  top: 15px;
  left: -75px;
  width: 300px;
  padding: 8px 0;
  transform: rotate(-45deg);
}
</style>


</head>
<body>
<div class="box">
  <div class="ribbon">Admission Closed</div>
</div>

















<!-- STRICT GLOBAL HEADER SIZE FIX V7 -->
<style id="global-header-size-fix-v7">
@media (min-width: 769px) {
    /* 1. Force strict 100px header container */
    html:root body header, 
    html:root body #ultimateScrollHeader header {
        height: 100px !important;
        max-height: 100px !important;
        min-height: 100px !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        display: flex !important;
        align-items: center !important;
    }
    
    /* 2. English Text Logo */
    html:root body header .brand-title-img-en, 
    html:root body #ultimateScrollHeader header .brand-title-img-en {
        height: 65px !important;
        max-height: 65px !important;
        min-height: 65px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
        transform: scale(1) !important;
    }
    
    /* 3. Urdu Text Logo - Scaled up visually to overcome transparent padding */
    html:root body header .urdu-title-png, 
    html:root body #ultimateScrollHeader header .urdu-title-png {
        height: 95px !important;
        max-height: 95px !important;
        min-height: 95px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
        transform: scale(1.35) !important; /* Increased scale slightly more */
    }
    
    /* 4. Crest Logo in English (Default) */
    html:root body header .header-logo img,
    html:root body #ultimateScrollHeader header .header-logo img {
        height: 80px !important;
        max-height: 80px !important; 
        min-height: 80px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
        transform: scale(1) !important;
    }
    
    /* 5. Crest Logo specifically in Urdu Mode - Correct Selectors! */
    html[lang="ur"]:root body header .header-logo img,
    html[lang="ur"]:root body #ultimateScrollHeader header .header-logo img,
    html[dir="rtl"]:root body header .header-logo img,
    html[dir="rtl"]:root body #ultimateScrollHeader header .header-logo img {
        height: 95px !important;
        max-height: 95px !important; 
        min-height: 95px !important;
        transform: scale(1.15) !important;
    }
}
</style>






<!-- MOBILE HEADER LAYOUT FIX -->
<style id="mobile-header-layout-fix">
@media (max-width: 768px) {
    html:root body header,
    html:root body #ultimateScrollHeader header {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: center !important;
        position: relative !important; /* Required for absolute centering */
    }
    
    /* 1. Logo should ALWAYS be at the START (Left in EN, Right in UR) */
    html:root body header .header-logo,
    html:root body #ultimateScrollHeader header .header-logo {
        order: 1 !important;
        margin: 0 !important;
        z-index: 20 !important; /* Keep clickable */
    }
    
    /* 2. Title should ALWAYS be perfectly CENTERED absolutely */
    html:root body header .brand-title-container,
    html:root body #ultimateScrollHeader header .brand-title-container {
        position: absolute !important;
        left: 50% !important;
        transform: translateX(-50%) !important;
        margin: 0 !important;
        z-index: 10 !important;
        width: max-content !important; /* Prevent text wrapping */
        display: flex !important;
        justify-content: center !important;
    }
    
    /* 3. Hamburger should ALWAYS be at the END (Right in EN, Left in UR) */
    html:root body header .mobile-menu-btn,
    html:root body #ultimateScrollHeader header .mobile-menu-btn {
        order: 3 !important;
        margin: 0 !important;
        z-index: 20 !important; /* Keep clickable */
    }
}
</style>


<!-- MOBILE MENU CLOSE FIX -->
<style id="mobile-menu-close-fix">
/* 1. Fix the Header Layout */
html:root body .mobile-menu-header {
    display: flex !important;
    flex-direction: row !important; /* Respects LTR/RTL natively */
    justify-content: space-between !important;
    align-items: center !important;
    width: 100% !important;
}
html:root body[dir="rtl"] .mobile-menu-header,
html:root html[lang="ur"] body .mobile-menu-header {
    flex-direction: row !important; /* Neutralize any old row-reverse hacks */
}
html:root body .mobile-menu-close {
    order: 2 !important; /* Force to the end of the flex container */
    margin: 0 !important; /* Neutralize any old margin hacks */
}
html:root body .menu-tag-label {
    order: 1 !important; /* Force to the start of the flex container */
    margin: 0 !important;
}
</style>

<!-- 2. Fix the Close Button Click Logic -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    // Attach listener to ALL close buttons dynamically
    document.body.addEventListener('click', (e) => {
        if (e.target.closest('.mobile-menu-close')) {
            const overlay = document.getElementById('mobileNavOverlay');
            if (overlay) overlay.classList.remove('is-active');
        }
    });
});
</script>

</body>
</html>
