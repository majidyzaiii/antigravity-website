<!DOCTYPE html>
<html>
<head>




<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<style>
.box {
  width: 400px;
  height: 400px;
  border: 2px solid green;
  position: relative;
  overflow: hidden;
  margin: 50px;
}
.ribbon {
  position: absolute;
  background: red;
  color: white;
  text-align: center;
  font-family: Arial;
  font-size: 20px;
  font-weight: bold;
  
  /* The tricky part */
  top: 15px;
  left: -75px;
  width: 300px;
  padding: 8px 0;
  transform: rotate(-45deg);
}
</style>








<!-- REMOVE SOLID WHITE STRIP UNDER PILL MENU -->
<style id="remove-white-strip-fix">
@media (min-width: 769px) {
    html body .floating-nav-container {
        background-color: transparent !important;
        box-shadow: none !important;
        border: none !important;
    }
    
    /* Remove the shadow line from the wrapper so it doesn't cast a line below the pill */
    html body .sticky-header {
        box-shadow: none !important;
        border-bottom: none !important;
    }
    
    /* Optionally, if you want the green header to have a shadow, add it directly to the header */
    html body .sticky-header header {
        box-shadow: 0 4px 15px rgba(0,0,0,0.1) !important;
    }
}
</style>


<!-- EXTEND HERO BACKGROUND TO TOP FIX -->
<style id="extend-hero-bg-fix">
@media (min-width: 769px) {
    /* Pull the hero section up to cover the body padding, and increase its padding so content stays in place */
    html body .hero-section {
        margin-top: -150px !important;
        padding-top: 250px !important;
    }
}
</style>


<!-- EXTEND ABOUT HEADER TO TOP FIX -->
<style id="extend-about-header-fix">
@media (min-width: 769px) {
    /* Pull the about minimal header up to cover the body padding, and increase its padding so content stays in place */
    html body div.about-minimal-header {
        margin-top: -150px !important;
        padding-top: 200px !important; /* Original was 50px */
    }
}
</style>

</head>
<body>
<div class="box">
  <div class="ribbon">Admission Closed</div>
</div>

















<!-- STRICT GLOBAL HEADER SIZE FIX V7 -->
<style id="global-header-size-fix-v7">
@media (min-width: 769px) {
    /* 1. Force strict 100px header container */
    html:root body header, 
    html:root body #ultimateScrollHeader header {
        height: 100px !important;
        max-height: 100px !important;
        min-height: 100px !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        display: flex !important;
        align-items: center !important;
    }
    
    /* 2. English Text Logo */
    html:root body header .brand-title-img-en, 
    html:root body #ultimateScrollHeader header .brand-title-img-en {
        height: 65px !important;
        max-height: 65px !important;
        min-height: 65px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
        transform: scale(1) !important;
    }
    
    /* 3. Urdu Text Logo - Scaled up visually to overcome transparent padding */
    html:root body header .urdu-title-png, 
    html:root body #ultimateScrollHeader header .urdu-title-png {
        height: 95px !important;
        max-height: 95px !important;
        min-height: 95px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
        transform: scale(1.35) !important; /* Increased scale slightly more */
    }
    
    /* 4. Crest Logo in English (Default) */
    html:root body header .header-logo img,
    html:root body #ultimateScrollHeader header .header-logo img {
        height: 80px !important;
        max-height: 80px !important; 
        min-height: 80px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
        transform: scale(1) !important;
    }
    
    /* 5. Crest Logo specifically in Urdu Mode - Correct Selectors! */
    html[lang="ur"]:root body header .header-logo img,
    html[lang="ur"]:root body #ultimateScrollHeader header .header-logo img,
    html[dir="rtl"]:root body header .header-logo img,
    html[dir="rtl"]:root body #ultimateScrollHeader header .header-logo img {
        height: 95px !important;
        max-height: 95px !important; 
        min-height: 95px !important;
        transform: scale(1.15) !important;
    }
}
</style>






<!-- MOBILE HEADER LAYOUT FIX -->
<style id="mobile-header-layout-fix">
@media (max-width: 768px) {
    html:root body header,
    html:root body #ultimateScrollHeader header {
        display: flex !important;
        flex-direction: row !important;
        justify-content: space-between !important;
        align-items: center !important;
        position: relative !important; /* Required for absolute centering */
    }
    
    /* 1. Logo should ALWAYS be at the START (Left in EN, Right in UR) */
    html:root body header .header-logo,
    html:root body #ultimateScrollHeader header .header-logo {
        order: 1 !important;
        margin: 0 !important;
        z-index: 20 !important; /* Keep clickable */
    }
    
    /* 2. Title should ALWAYS be perfectly CENTERED absolutely */
    html:root body header .brand-title-container,
    html:root body #ultimateScrollHeader header .brand-title-container {
        position: absolute !important;
        left: 50% !important;
        top: 50% !important;
        transform: translate(-50%, -50%) !important;
        margin: 0 !important;
        z-index: 10 !important;
        width: max-content !important; /* Prevent text wrapping */
        display: flex !important;
        justify-content: center !important;
    }
    
    /* 3. Hamburger should ALWAYS be at the END (Right in EN, Left in UR) */
    html:root body header .mobile-menu-btn,
    html:root body #ultimateScrollHeader header .mobile-menu-btn {
        order: 3 !important;
        margin: 0 !important;
        z-index: 20 !important; /* Keep clickable */
    }
}
</style>


<!-- MOBILE MENU CLOSE FIX -->
<style id="mobile-menu-close-fix">
/* 1. Fix the Header Layout */
html:root body .mobile-menu-header {
    display: flex !important;
    flex-direction: row !important; /* Respects LTR/RTL natively */
    justify-content: space-between !important;
    align-items: center !important;
    width: 100% !important;
}
html:root body[dir="rtl"] .mobile-menu-header,
html:root html[lang="ur"] body .mobile-menu-header {
    flex-direction: row !important; /* Neutralize any old row-reverse hacks */
}
html:root body .mobile-menu-close {
    order: 2 !important; /* Force to the end of the flex container */
    margin: 0 !important; /* Neutralize any old margin hacks */
}
html:root body .menu-tag-label {
    order: 1 !important; /* Force to the start of the flex container */
    margin: 0 !important;
}
</style>

<!-- 2. Fix the Close Button Click Logic -->
<script>
document.addEventListener('DOMContentLoaded', () => {
    // Attach listener to ALL close buttons dynamically
    document.body.addEventListener('click', (e) => {
        if (e.target.closest('.mobile-menu-close')) {
            const overlay = document.getElementById('mobileNavOverlay');
            if (overlay) overlay.classList.remove('is-active');
        }
    });
});
</script>


<!-- MOBILE MENU FONT SIZE FIX -->
<style id="mobile-menu-font-size-fix">
/* 1. Force strict uniform small size for ALL mobile menu links (English & Urdu) */
html:root body .mobile-nav-links a,
html:root body .mobile-nav-links .m-link,
html:root body .mobile-lang-btn,
html:root body[dir="rtl"] .mobile-nav-links a,
html:root html[lang="ur"] body .mobile-nav-links a,
html:root body[dir="rtl"] .mobile-lang-btn,
html:root html[lang="ur"] body .mobile-lang-btn {
    font-size: 14px !important; /* Uniform small size */
    line-height: 1.5 !important;
    font-weight: 600 !important;
}

/* Ensure no rogue scaling on active states */
html:root body .mobile-nav-links a.active,
html:root body[dir="rtl"] .mobile-nav-links a.active {
    font-size: 14px !important;
    font-weight: 700 !important; /* Make active just bold, not larger */
}
</style>


<!-- MOBILE MENU ALIGNMENT FIX -->
<style id="mobile-menu-align-fix">
html:root body .mobile-menu-card .mobile-nav-links a,
html:root body .mobile-menu-card .mobile-lang-btn {
    justify-content: flex-start !important;
    padding-left: 14px !important;
    padding-right: 14px !important;
    width: 100% !important;
    box-sizing: border-box !important;
}
</style>


<!-- NEW UNIFIED RESPONSIVE MENU DRAWER/MODAL FIX -->
<style id="new-unified-menu-modal">
/* 1. Reset the Overlay */
html:root body .mobile-nav-overlay {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    background: rgba(0, 0, 0, 0.4) !important;
    backdrop-filter: blur(4px) !important;
    -webkit-backdrop-filter: blur(4px) !important;
    z-index: 99999 !important;
    display: flex !important;
    opacity: 0 !important;
    pointer-events: none !important;
    transition: opacity 0.3s ease !important;
}
html:root body .mobile-nav-overlay.is-active {
    opacity: 1 !important;
    pointer-events: auto !important;
}

/* 2. Base Card Styling (Fluid & Hug Content) */
html:root body .mobile-menu-card {
    background: #ffffff !important;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15) !important;
    display: flex !important;
    flex-direction: column !important;
    height: max-content !important; /* Hug content */
    overflow-y: auto !important;
    transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease !important;
    box-sizing: border-box !important;
}

/* 3. MOBILE VIEW (< 768px): Acts as a Side Drawer */
@media (max-width: 768px) {
    html:root body .mobile-nav-overlay {
        align-items: flex-start !important; /* Align to top */
    }
    
    html:root body .mobile-menu-card {
        width: 90% !important;
        min-width: 280px !important;
        max-width: 340px !important;
        padding: 24px !important;
        border-radius: 20px !important;
        position: absolute !important;
        top: 90px !important; /* Just below the mobile header */
        
        /* Default English (LTR): Slide from RIGHT */
        right: 16px !important;
        left: auto !important;
        transform: translateX(120%) scale(0.95) !important;
        opacity: 0 !important;
    }
    
    html:root body .mobile-nav-overlay.is-active .mobile-menu-card {
        transform: translateX(0) scale(1) !important;
        opacity: 1 !important;
    }

    /* Urdu Mode (RTL): Slide from LEFT */
    html:root body[dir="rtl"] .mobile-menu-card,
    html:root html[lang="ur"] body .mobile-menu-card {
        right: auto !important;
        left: 16px !important;
        transform: translateX(-120%) scale(0.95) !important;
    }
    html:root body[dir="rtl"] .mobile-nav-overlay.is-active .mobile-menu-card,
    html:root html[lang="ur"] body .mobile-nav-overlay.is-active .mobile-menu-card {
        transform: translateX(0) scale(1) !important;
    }
}

/* 4. PC / DESKTOP VIEW (>= 768px): Acts as a Centered Modal */
@media (min-width: 769px) {
    html:root body .mobile-nav-overlay {
        justify-content: center !important;
        align-items: center !important; /* Perfectly centered */
    }
    
    html:root body .mobile-menu-card {
        width: 100% !important;
        max-width: 400px !important;
        padding: 32px !important;
        border-radius: 24px !important;
        position: relative !important;
        transform: translateY(30px) scale(0.95) !important;
        opacity: 0 !important;
        margin: 0 auto !important;
        left: auto !important;
        right: auto !important;
        top: auto !important;
    }
    
    html:root body .mobile-nav-overlay.is-active .mobile-menu-card {
        transform: translateY(0) scale(1) !important;
        opacity: 1 !important;
    }
}
</style>


<!-- COMPACT MENU SIZE & BULLETPROOF TOGGLE FIX -->
<style id="compact-menu-fix">
/* Shrink the card itself */
@media (max-width: 768px) {
    html:root body .mobile-menu-card {
        width: 220px !important; /* Extremely compact width */
        min-width: 200px !important;
        max-width: 240px !important;
        padding: 12px 16px !important; /* Tight padding */
        border-radius: 16px !important;
    }
}

/* Shrink the links inside the card */
html:root body .mobile-menu-card .mobile-nav-links {
    gap: 0 !important; /* Remove gaps between links */
}
html:root body .mobile-menu-card .mobile-nav-links a,
html:root body .mobile-menu-card .mobile-lang-btn {
    height: 32px !important; /* Compact height */
    padding: 0 8px !important;
    font-size: 13px !important; /* Even smaller font size */
}
html:root body .mobile-menu-card .menu-divider {
    margin: 4px 8px !important; /* Tighter margins on dividers */
}
html:root body .mobile-menu-header {
    margin-bottom: 8px !important; /* Tighter gap below header */
}
</style>

<script>
// Bulletproof delegated listener for ALL hamburger buttons to fix about.html and others
document.addEventListener('DOMContentLoaded', () => {
    document.body.addEventListener('click', (e) => {
        const btn = e.target.closest('.mobile-menu-btn') || e.target.closest('.minimal-hamburger-btn');
        if (btn) {
            e.preventDefault();
            const overlay = document.getElementById('mobileNavOverlay');
            if (overlay) overlay.classList.add('is-active');
        }
    });
});
</script>


<!-- ULTIMATE UNIFORM MOBILE MENU FIX -->
<style id="ultimate-uniform-menu-fix">
/* Base font family and strict sizes for ALL English links (active or not) */
html:root body .mobile-menu-card .mobile-nav-links a,
html:root body .mobile-menu-card .mobile-nav-links a.active,
html:root body .mobile-menu-card .mobile-lang-btn,
html:root body .mobile-menu-card .mobile-lang-btn.active {
    font-family: 'Outfit', sans-serif !important;
    font-size: 14px !important; /* Uniform exact size */
    font-weight: 600 !important;
    text-transform: uppercase !important; /* Guarantee uniform casing */
}

/* Base font family and strict sizes for ALL Urdu links (active or not) */
html:root body[dir="rtl"] .mobile-menu-card .mobile-nav-links a,
html:root body[dir="rtl"] .mobile-menu-card .mobile-nav-links a.active,
html:root html[lang="ur"] body .mobile-menu-card .mobile-nav-links a,
html:root html[lang="ur"] body .mobile-menu-card .mobile-nav-links a.active {
    font-family: 'Jameel Noori Nastaleeq', Arial, sans-serif !important;
    font-size: 17px !important; /* Nastaleeq needs to be slightly larger to visually match 14px Outfit */
    font-weight: 600 !important;
}

/* Ensure Urdu language button stays Outfit in RTL mode */
html:root body[dir="rtl"] .mobile-menu-card .mobile-lang-btn,
html:root html[lang="ur"] body .mobile-menu-card .mobile-lang-btn {
    font-family: 'Outfit', sans-serif !important;
    font-size: 14px !important;
}

/* Force active state to only change color/background, NOT size! */
html:root body .mobile-menu-card .mobile-nav-links a.active {
    background: #f1f5f9 !important;
    color: #006754 !important; /* Accent color to indicate active, but NO size change */
}
</style>


<!-- OMEGA MENU FIX -->
<style id="omega-menu-fix">
/* FORCE ALL LINKS TO EXACT SAME SIZE WITH EXTREME SPECIFICITY */
html body #mobileNavOverlay .mobile-menu-card .mobile-nav-links a,
html body #mobileNavOverlay .mobile-menu-card .mobile-nav-links a.active,
html body #mobileNavOverlay .mobile-menu-card .mobile-lang-btn,
html body #mobileNavOverlay .mobile-menu-card .mobile-lang-btn.active {
    font-family: 'Outfit', sans-serif !important;
    font-size: 14px !important;
    font-weight: 600 !important;
    line-height: 1.2 !important;
    height: 32px !important;
    padding: 0 10px !important;
    text-transform: uppercase !important;
    display: flex !important;
    align-items: center !important;
    -webkit-text-size-adjust: none !important;
}

html[lang="ur"] body #mobileNavOverlay .mobile-menu-card .mobile-nav-links a,
html[dir="rtl"] body #mobileNavOverlay .mobile-menu-card .mobile-nav-links a,
body[dir="rtl"] #mobileNavOverlay .mobile-menu-card .mobile-nav-links a {
    font-family: 'Jameel Noori Nastaleeq', Arial, sans-serif !important;
    font-size: 17px !important;
}

html[lang="ur"] body #mobileNavOverlay .mobile-menu-card .mobile-lang-btn,
html[dir="rtl"] body #mobileNavOverlay .mobile-menu-card .mobile-lang-btn,
body[dir="rtl"] #mobileNavOverlay .mobile-menu-card .mobile-lang-btn {
    font-family: 'Outfit', sans-serif !important;
    font-size: 14px !important;
}

#mobileNavOverlay .mobile-menu-card .mobile-nav-links a.active {
    background: #f1f5f9 !important;
    color: #006754 !important;
}
</style>

<script>
// OVERRIDE ALL OTHER HAMBURGER LISTENERS TO PREVENT DOUBLE-TOGGLE BUGS
document.addEventListener('DOMContentLoaded', () => {
    document.body.addEventListener('click', (e) => {
        const btn = e.target.closest('.mobile-menu-btn') || e.target.closest('.minimal-hamburger-btn');
        if (btn) {
            e.preventDefault();
            e.stopPropagation(); // STOP BUBBLING! Prevents inline or other listeners from immediately closing it!
            const overlay = document.getElementById('mobileNavOverlay');
            if (overlay) overlay.classList.add('is-active');
        }
    }, true); // Use CAPTURE phase to intercept before any other scripts!
});
</script>
