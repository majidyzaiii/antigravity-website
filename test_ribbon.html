<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 400px;
  height: 400px;
  border: 2px solid green;
  position: relative;
  overflow: hidden;
  margin: 50px;
}
.ribbon {
  position: absolute;
  background: red;
  color: white;
  text-align: center;
  font-family: Arial;
  font-size: 20px;
  font-weight: bold;
  
  /* The tricky part */
  top: 15px;
  left: -75px;
  width: 300px;
  padding: 8px 0;
  transform: rotate(-45deg);
}
</style>
</head>
<body>
<div class="box">
  <div class="ribbon">Admission Closed</div>
</div>
</body>
</html>
