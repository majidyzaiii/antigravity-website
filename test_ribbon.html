<!DOCTYPE html>
<html>
<head>
<style>
.box {
  width: 400px;
  height: 400px;
  border: 2px solid green;
  position: relative;
  overflow: hidden;
  margin: 50px;
}
.ribbon {
  position: absolute;
  background: red;
  color: white;
  text-align: center;
  font-family: Arial;
  font-size: 20px;
  font-weight: bold;
  
  /* The tricky part */
  top: 15px;
  left: -75px;
  width: 300px;
  padding: 8px 0;
  transform: rotate(-45deg);
}
</style>

<style id="global-header-size-fix">
@media (min-width: 769px) {
    /* 1. Force strict 100px header container */
    header, #ultimateScrollHeader header {
        height: 100px !important;
        max-height: 100px !important;
        min-height: 100px !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
        display: flex !important;
        align-items: center !important;
    }
    
    /* 2. Force text logos to exactly 65px */
    header .brand-title-img-en, 
    #ultimateScrollHeader header .brand-title-img-en,
    header .urdu-title-png, 
    #ultimateScrollHeader header .urdu-title-png {
        height: 65px !important;
        max-height: 65px !important;
        min-height: 65px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
    }
    
    /* 3. Force crest logo to exactly 75px */
    header .header-logo img,
    #ultimateScrollHeader header .header-logo img {
        height: 75px !important;
        max-height: 75px !important; 
        min-height: 75px !important;
        width: auto !important;
        margin: 0 !important;
        object-fit: contain !important;
    }
}
</style>
</head>
<body>
<div class="box">
  <div class="ribbon">Admission Closed</div>
</div>
</body>
</html>
